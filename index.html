<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP：只允许同源资源，禁止内联脚本/样式与外部请求。
    注意：file:// 协议下本地文件没有 origin 语义，'self' 无法匹配，
    Chrome/Edge 双击打开本页会被拦截（无样式、无交互）。
    本地预览请用 `npx serve .` 或 `python -m http.server 8000`；
    若必须保留双击 file:// 的用法，删除下面这行 meta 即可（同时失去 CSP 保护）。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>王者荣耀重复名生成</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="card">
    <h1 class="title">王者荣耀重复名生成</h1>

    <div class="field">
      <label class="label" for="name">输入名称</label>
      <div class="input-wrap">
        <input id="name" class="input" type="text" placeholder="留空则生成空白名"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="btn btn-clear" id="clearBtn">清空</button>
      </div>
      <div class="counter" id="counter">
        当前字数：<span id="charCount">0</span>/6<span class="hint-icon" tabindex="0"
          data-tip="1 个英文字母或数字计为 0.5 字"
          aria-label="1 个英文字母或数字计为 0.5 字">?</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="generateBtn">生成名称</button>
      <button class="btn btn-success" id="copyBtn" disabled>复制名称</button>
    </div>

    <div class="result" id="result"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
